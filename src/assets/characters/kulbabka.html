<!DOCTYPE html>

<meta charset="UTF-8">

<title>Кульбабка</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at 40% 20%, #fffde7 0%, #a5d6a7 40%, #388e3c 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    padding: 40px 20px;
    gap: 16px;
  }
  .label {
    color: white;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.85;
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-2deg) translateY(0); }
    50% { transform: rotate(2deg) translateY(-8px); }
  }
  @keyframes floatSeed {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0.8; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--dr)); opacity: 0; }
  }
  @keyframes eyeBlink {
    0%, 88%, 100% { transform: scaleY(1); }
    94% { transform: scaleY(0.07); }
  }
  @keyframes puffPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  .main-group { animation: sway 4s ease-in-out infinite; transform-origin: 160px 310px; }
  .puff { animation: puffPulse 4s ease-in-out infinite; transform-origin: 160px 155px; }
  .left-eye { animation: eyeBlink 6s ease-in-out infinite; transform-origin: 138px 168px; }
  .right-eye { animation: eyeBlink 6s ease-in-out infinite 0.15s; transform-origin: 182px 168px; }

  .seed { animation: floatSeed 4s ease-in infinite; }
  .s1 { --dx: -30px; --dy: -60px; --dr: -20deg; animation-delay: 0s; animation-duration: 5s; }
  .s2 { --dx: 40px;  --dy: -70px; --dr: 15deg;  animation-delay: 1s; animation-duration: 4.5s; }
  .s3 { --dx: -50px; --dy: -40px; --dr: -30deg; animation-delay: 2s; animation-duration: 6s; }
  .s4 { --dx: 60px;  --dy: -50px; --dr: 25deg;  animation-delay: 0.5s; animation-duration: 5.5s; }
  .s5 { --dx: 20px;  --dy: -80px; --dr: 10deg;  animation-delay: 1.5s; animation-duration: 4s; }
  .s6 { --dx: -40px; --dy: -65px; --dr: -15deg; animation-delay: 2.5s; animation-duration: 5s; }
</style>
</head>
