<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хрущ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at 40% 25%, #fff8e1 0%, #ffcc80 40%, #e65100 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    padding: 40px 20px;
    gap: 16px;
  }
  .label {
    color: white;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.85;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-10px) rotate(1deg); }
  }
  @keyframes eyeBlink {
    0%, 88%, 100% { transform: scaleY(1); }
    94% { transform: scaleY(0.07); }
  }
  @keyframes antennaWave {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }
  @keyframes wingShimmer {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 0.75; }
  }
  @keyframes shine {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.6; }
  }

  .body-group { animation: bounce 3.5s ease-in-out infinite; transform-origin: 160px 300px; }
  .left-eye  { animation: eyeBlink 5s ease-in-out infinite; transform-origin: 132px 198px; }
  .right-eye { animation: eyeBlink 5s ease-in-out infinite 0.1s; transform-origin: 188px 198px; }
  .antenna-left  { animation: antennaWave 2.5s ease-in-out infinite; transform-origin: 118px 112px; }
  .antenna-right { animation: antennaWave 2.5s ease-in-out infinite reverse; transform-origin: 202px 112px; }
  .wings { animation: wingShimmer 3s ease-in-out infinite; }
  .shine-body { animation: shine 3s ease-in-out infinite; }
</style>
</head>
<body>

<svg width="320" height="400" viewBox="0 0 320 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bodyGlass" cx="35%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#fff3e0" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#ffe0b2" stop-opacity="0.82"/>
      <stop offset="65%" stop-color="#ffb74d" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#e65100" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="headGlass" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fff3e0" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ffcc80" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#ff8f00" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#bf360c" stop-opacity="0.75"/>
    </radialGradient>
    <radialGradient id="bodyGlow" cx="38%" cy="32%" r="55%">
      <stop offset="0%" stop-color="white" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wingGrad" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fff8e1" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ffcc02" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#bf8000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8d5524" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="legGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc80" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bf360c" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="antennaGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#bf360c"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <radialGradient id="irisG" cx="32%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#4e2000"/>
      <stop offset="50%" stop-color="#1a0800"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="blushG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb3ba" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffb3ba" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a1a00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4a1a00" stop-opacity="0"/>
    </radialGradient>
    <filter id="furTex" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wingFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="leafFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#4a1a00" flood-opacity="0.25"/>
    </filter>
